{% extends "base.html" %}

{% block title %}Security Awareness Campaign - Invaryant ISMS Platform{% endblock %}

{% block content %}
<div class="card app-panel p-4" style="max-width: 800px; margin: 0 auto;">
    <h2>Generate Monthly Security Awareness Video</h2>
    <p class="text-muted">Create a short awareness briefing and assign it to all active users in this tenant.</p>

    <form method="POST" action="/security-awareness/generate">
        <input type="hidden" name="csrf_token" value="{{ session.get('_csrf_token') }}">

        <div class="mb-3">
            <label for="title" class="form-label">Campaign title</label>
            <input id="title" name="title" class="form-control" value="Security Awareness - {{ default_month }}" required>
        </div>

        <div class="row g-3">
            <div class="col-md-6">
                <label for="month_label" class="form-label">Month</label>
                <input id="month_label" name="month_label" class="form-control" value="{{ default_month }}" required>
            </div>
            <div class="col-md-6">
                <label for="due_date" class="form-label">Due date</label>
                <input id="due_date" type="date" name="due_date" class="form-control">
            </div>
        </div>

        <div class="mt-3 mb-3">
            <label for="video_title" class="form-label">Video title</label>
            <input id="video_title" name="video_title" class="form-control" value="Monthly Security Awareness Briefing" required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Summary</label>
            <textarea id="description" name="description" rows="5" class="form-control" required>Monthly security awareness briefing covering phishing, password hygiene, social engineering, and secure working practices.</textarea>
        </div>

        <div class="mb-3">
            <label for="video_url" class="form-label">Video URL</label>
            <input id="video_url" name="video_url" class="form-control" placeholder="https://example.com/security-awareness-video.mp4" required>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Generate campaign</button>
            <a href="/security-awareness" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
