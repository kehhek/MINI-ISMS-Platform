{% extends "base.html" %}

{% block title %}{% if risk %}Edit Risk{% else %}New Risk{% endif %} - Invaryant ISMS Platform{% endblock %}

{% block content %}
<h2>{% if risk %}Edit Risk: {{ risk.title }}{% else %}Create New Risk{% endif %}</h2>

<form method="POST" style="max-width: 700px; margin-top: 2rem;">
    <input type="hidden" name="csrf_token" value="{{ session.get('_csrf_token') }}">
    <div style="margin-bottom: 1.5rem;">
        <label for="title" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Risk Title *</label>
        <input
            type="text"
            id="title"
            name="title"
            value="{{ risk.title if risk else '' }}"
            required
            style="width: 100%; padding: 0.75rem; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 1rem;"
        >
    </div>

    <div style="margin-bottom: 1.5rem;">
        <label for="description" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Description</label>
        <textarea
            id="description"
            name="description"
            rows="4"
            placeholder="Describe the risk scenario, trigger, and impact..."
            style="width: 100%; padding: 0.75rem; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 1rem; font-family: inherit;"
        >{{ risk.description if risk else '' }}</textarea>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
        <div>
            <label for="likelihood" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Likelihood</label>
            <select id="likelihood" name="likelihood" style="width: 100%; padding: 0.75rem; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 1rem;">
                <option value="">Select</option>
                {% for value in range(1, 6) %}
                <option value="{{ value }}" {% if risk and risk.likelihood == value %}selected{% endif %}>{{ value }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="impact" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Impact</label>
            <select id="impact" name="impact" style="width: 100%; padding: 0.75rem; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 1rem;">
                <option value="">Select</option>
                {% for value in range(1, 6) %}
                <option value="{{ value }}" {% if risk and risk.impact == value %}selected{% endif %}>{{ value }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
        <div>
            <label for="status" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Status</label>
            <select id="status" name="status" style="width: 100%; padding: 0.75rem; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 1rem;">
                <option value="Open" {% if risk and risk.status == 'Open' %}selected{% endif %}>Open</option>
                <option value="Mitigated" {% if risk and risk.status == 'Mitigated' %}selected{% endif %}>Mitigated</option>
                <option value="Accepted" {% if risk and risk.status == 'Accepted' %}selected{% endif %}>Accepted</option>
                <option value="Closed" {% if risk and risk.status == 'Closed' %}selected{% endif %}>Closed</option>
            </select>
        </div>
        <div>
            <label for="owner" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Owner</label>
            <input
                type="text"
                id="owner"
                name="owner"
                value="{{ risk.owner if risk else '' }}"
                placeholder="Risk owner"
                style="width: 100%; padding: 0.75rem; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 1rem;"
            >
        </div>
    </div>

    <div style="margin-bottom: 1.5rem;">
        <label for="asset_id" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Related Asset</label>
        <select id="asset_id" name="asset_id" style="width: 100%; padding: 0.75rem; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 1rem;">
            <option value="">No asset selected</option>
            {% for asset in assets %}
            <option value="{{ asset.id }}" {% if risk and risk.asset_id == asset.id %}selected{% endif %}>{{ asset.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div style="display: flex; gap: 1rem; margin-top: 2rem;">
        <button
            type="submit"
            style="background-color: #e74c3c; color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold;"
        >
            {% if risk %}Update Risk{% else %}Create Risk{% endif %}
        </button>
        <a
            href="/risks"
            style="background-color: #95a5a6; color: white; padding: 0.75rem 1.5rem; border-radius: 4px; text-decoration: none; display: inline-block; font-weight: bold;"
        >
            Cancel
        </a>
    </div>
</form>
{% endblock %}
