<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mini ISMS Platform{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand-wrap">
                <div class="brand-mark">IS</div>
                <div>
                    <div class="eyebrow">Governance Suite</div>
                    <h1>Mini ISMS Platform</h1>
                </div>
            </div>
            <div class="topbar-actions">
                <span class="status-dot"></span>
                <span>Operational</span>
            </div>
        </header>

        <nav class="main-nav" aria-label="Main navigation">
            <a class="nav-brand" href="/overview">Overview</a>
            <div class="nav-menu">
                <a class="nav-link" href="/dashboard">Dashboard</a>
                <a class="nav-link" href="/assets">Assets</a>
                <a class="nav-link" href="/risks">Risks</a>
                <a class="nav-link" href="/policies">Policies</a>
                <a class="nav-link" href="/controls">Controls</a>
                <a class="nav-link" href="/findings">Findings</a>
                <a class="nav-link" href="/evidence">Evidence</a>
                <a class="nav-link" href="/reports">Reports</a>
                <a class="nav-link" href="/audit-trail">Audit Trail</a>
            </div>
        </nav>

        <main>
            <div class="container app-panel">
                {% block content %}{% endblock %}
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Mini ISMS Platform. All rights reserved.</p>
        </footer>
    </div>

    {% block extra_js %}{% endblock %}
</body>
</html>
